const KEY="nsmcq-v1",labels=["A","B","C","D"],$=id=>document.getElementById(id);
const quiz=$("quiz"),filter=$("filter"),mode=$("mode"),show=$("show");
let state={answers:{},submitted:false,order:null,optOrder:{},mode:"instant",filter:"all",theme:null};
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
if(state.theme)document.documentElement.dataset.theme=state.theme;
mode.value=state.mode;filter.value=state.filter;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const order=()=>state.order||raw.map((_,i)=>i);
const opts=id=>state.optOrder[id]||[0,1,2,3];
const revealed=()=>mode.value==="instant"||state.submitted;
const inLecture=id=>filter.value==="all"||String(raw[id][0])===filter.value;
function visible(){return order().filter(id=>{const q=raw[id],a=state.answers[id];
 if(!inLecture(id))return false;
 if(show.value==="unanswered")return a===undefined;
 if(show.value==="wrong")return a!==undefined&&a!==q[3]&&revealed();
 return true})}
function card(id,n){
 const q=raw[id],picked=state.answers[id],rv=revealed(),locked=state.submitted||(rv&&picked!==undefined);
 const c=document.createElement("section");c.className="question";c.dataset.id=id;c.dataset.n=n;
 c.innerHTML=`<div class="qtop"><span>#${n} · Q${id+1}</span><span>Lecture ${q[0]}</span></div>`;
 const h=document.createElement("h3");h.textContent=q[1];c.append(h);
 const o=document.createElement("div");o.className="options";
 opts(id).forEach((j,pos)=>{const b=document.createElement("button");b.className="option";b.disabled=locked;
  b.innerHTML=`<span class="letter">${labels[pos]})</span><span></span>`;b.lastChild.textContent=q[2][j];
  if(picked===j)b.classList.add("picked");
  if(rv&&(picked!==undefined||state.submitted)){if(j===q[3])b.classList.add("correct");else if(picked===j)b.classList.add("wrong")}
  b.onclick=()=>pick(id,j);o.append(b)});
 c.append(o);
 if(rv&&(picked!==undefined||state.submitted)){const f=document.createElement("div");const ok=picked===q[3];
  f.className="feedback "+(ok?"good":"bad");const pos=opts(id).indexOf(q[3]);
  f.textContent=ok?"✓ Correct":(picked===undefined?"Not answered":"✗ Incorrect")+" — answer: "+labels[pos]+") "+q[2][q[3]];c.append(f)}
 return c}
function pick(id,j){if(state.submitted)return;if(state.answers[id]!==undefined&&mode.value==="instant")return;
 state.answers[id]=j;save();const old=quiz.querySelector(`[data-id="${id}"]`);
 if(old)old.replaceWith(card(id,+old.dataset.n));stats()}
function render(){
 const list=visible();quiz.innerHTML="";
 if(!list.length)quiz.innerHTML=`<div class="empty">${show.value==="wrong"?"No wrong answers to review 🎉":"Nothing to show here."}</div>`;
 list.forEach((id,i)=>quiz.append(card(id,i+1)));
 $("submit").style.display=mode.value==="exam"&&!state.submitted?"inline-block":"none";
 stats()}
function stats(){
 const ids=order().filter(inLecture);
 const ans=ids.filter(id=>state.answers[id]!==undefined).length,cor=ids.filter(id=>state.answers[id]===raw[id][3]).length,hide=!revealed();
 $("total").textContent=ids.length;$("answered").textContent=ans;
 $("score").textContent=hide?"—":cor;$("percent").textContent=hide?"—":(ans?Math.round(cor/ans*100):0)+"%";
 $("bar").style.width=(ids.length?ans/ids.length*100:0)+"%";
 const r=$("result");
 if(state.submitted&&mode.value==="exam"){r.style.display="block";
  r.innerHTML=`<b style="font-size:1.5rem">${cor} / ${ids.length}</b><br>${Math.round(cor/ids.length*100)}% score · ${ids.length-ans} unanswered<br><button id="rw" style="margin-top:10px">Review wrong answers</button> <button id="again" class="primary" style="margin-top:10px">Try again</button>`;
  $("rw").onclick=()=>{show.value="wrong";render()};
  $("again").onclick=()=>{state.answers={};state.submitted=false;save();show.value="all";render();scrollTo(0,0)}}
 else r.style.display="none"}
filter.onchange=()=>{state.filter=filter.value;save();render();scrollTo(0,0)};
show.onchange=render;
mode.onchange=()=>{state.mode=mode.value;state.submitted=false;save();render()};
$("submit").onclick=()=>{const left=order().filter(inLecture).filter(id=>state.answers[id]===undefined).length;
 if(left&&!confirm(left+" questions unanswered. Submit anyway?"))return;state.submitted=true;save();render();scrollTo({top:0,behavior:"smooth"})};
$("shuffle").onclick=()=>{state.order=shuf(raw.map((_,i)=>i));raw.forEach((_,i)=>state.optOrder[i]=shuf([0,1,2,3]));save();render();scrollTo(0,0)};
$("reset").onclick=()=>{if(confirm("Reset all answers and question order?")){state.answers={};state.submitted=false;state.order=null;state.optOrder={};save();render();scrollTo(0,0)}};
$("next").onclick=()=>{const c=[...quiz.querySelectorAll(".question")].find(c=>state.answers[c.dataset.id]===undefined);
 if(c)c.scrollIntoView({behavior:"smooth",block:"center"});else alert("All shown questions are answered!")};
$("theme").onclick=()=>{const cur=document.documentElement.dataset.theme==="light"?"dark":"light";document.documentElement.dataset.theme=cur;state.theme=cur;save()};
addEventListener("keydown",e=>{if(e.target.tagName==="SELECT"||e.ctrlKey||e.metaKey||e.altKey)return;const k="1234abcd".indexOf(e.key.toLowerCase());if(k<0)return;
 const mid=innerHeight/2,c=[...quiz.querySelectorAll(".question")].find(c=>{const r=c.getBoundingClientRect();return r.top<mid&&r.bottom>mid});
 if(c){const b=c.querySelectorAll(".option")[k%4];if(b&&!b.disabled)b.click()}});
render();
</script>
